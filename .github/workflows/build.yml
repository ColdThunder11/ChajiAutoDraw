name: Build Windows EXE

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (uses .python-version and uv.lock, with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Package with PyInstaller
        run: >
          uv run pyinstaller --noconfirm --clean --onefile --windowed
          --name ChajiAutoDraw --icon assets/icon.ico --add-data "assets;assets"
          --exclude-module tests --exclude-module pytest
          launcher.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChajiAutoDraw-windows-x64
          path: dist/ChajiAutoDraw.exe
          if-no-files-found: error
          retention-days: 14
