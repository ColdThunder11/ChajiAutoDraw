[project]
name = "chaji-autodraw"
version = "1.1.1"
description = "霸王茶姬小程序自定义杯贴自动绘制工具"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pyside6",
    "pillow",
    "numpy",
    "pyautogui",
    "pywin32; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest",
]

[project.scripts]
chaji-autodraw = "chaji_autodraw.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaji_autodraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
